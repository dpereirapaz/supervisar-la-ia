[build]
  publish = "."
  # Sin despliegue si el push solo cambia documentación (.md): cada despliegue consume créditos
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# supervisarlaia.com es un alias: todo se redirige al dominio principal
[[redirects]]
  from = "https://supervisarlaia.com/*"
  to = "https://supervisarlaia.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.supervisarlaia.com/*"
  to = "https://supervisarlaia.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/informe"
  to = "/.netlify/functions/informe"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
