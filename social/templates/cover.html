<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plantilla 4 · cover</title>
<script type="application/json" id="copy">
{
  "title": "Supervisar<br>la IA",
  "subtitle": "Seis decisiones que un consejo no puede delegar",
  "author": "David Pereira Paz",
  "url": "[__]"
}
</script>
<style>
  @font-face { font-family: "Poppins"; font-weight: 600; font-display: block; src: url("../../assets/fonts/poppins-600.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 400; font-display: block; src: url("../../assets/fonts/poppins-400.woff2") format("woff2"); }
  @font-face { font-family: "Lora"; font-style: italic; font-weight: 400; font-display: block; src: url("../../assets/fonts/lora-italic.woff2") format("woff2"); }
  :root {
    --ink: #18212F; --text: #1C2430; --muted: #5A6474; --paper: #FFFFFF; --tint: #F1F3F6; --rule: #D9DCE1; --signal: #C8102E;
    --on-ink: #DCE1E8; --on-ink-muted: #9AA3B0;
    --margin: 80px;
    --title-size: 120px;
    --subtitle-size: 44px;
    --numeral-size: 900px;
    --footer-size: 28px;
    --rule-width: 48px;
  }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body { background: var(--ink); color: #FFFFFF; font-family: "Poppins", sans-serif; position: relative; }
  .rule { position: absolute; left: var(--margin); top: var(--margin); width: var(--rule-width); height: 4px; background: var(--signal); }
  .text { position: absolute; left: var(--margin); right: var(--margin); top: calc(var(--margin) + 40px); }
  h1 { margin: 0 0 24px; font-weight: 600; font-size: var(--title-size); line-height: 1.02; color: #FFFFFF; max-width: 70%; }
  .subtitle { margin: 0; font-family: "Lora", serif; font-style: italic; font-weight: 400; font-size: var(--subtitle-size); line-height: 1.3; color: var(--on-ink); max-width: 62%; }
  .numeral { position: absolute; right: -0.04em; bottom: -0.22em; font-weight: 600; font-size: var(--numeral-size); line-height: 1; color: var(--signal); }
  .footer { position: absolute; left: var(--margin); bottom: var(--margin); font-weight: 400; font-size: var(--footer-size); line-height: 1.4; }
  .footer .author { color: #FFFFFF; }
  .footer .url { color: var(--on-ink-muted); }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="text">
    <h1 data-field="title" data-html></h1>
    <p class="subtitle" data-field="subtitle"></p>
  </div>
  <div class="numeral" aria-hidden="true">6</div>
  <div class="footer">
    <div class="author" data-field="author"></div>
    <div class="url" data-field="url"></div>
  </div>
  <script>
    (function () {
      var copy = JSON.parse(document.getElementById("copy").textContent);
      var over = window.__copy || {};
      Object.keys(over).forEach(function (k) { copy[k] = over[k]; });
      var vars = window.__vars || {};
      Object.keys(vars).forEach(function (k) { document.documentElement.style.setProperty(k, vars[k]); });
      document.querySelectorAll("[data-field]").forEach(function (el) {
        var v = copy[el.getAttribute("data-field")];
        if (v == null) return;
        if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
      });
    })();
  </script>
</body>
</html>
