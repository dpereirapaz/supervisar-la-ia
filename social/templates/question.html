<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plantilla 2 · question</title>
<script type="application/json" id="copy">
{
  "kicker": "Supervisión de la IA · Guía breve para consejeros",
  "question": "¿Puede la dirección decirnos qué no va a hacer este año con la IA, quién puede frenar un proyecto y qué dato nos va a traer?",
  "answer": "Si no, el consejo todavía no supervisa la IA.",
  "url": "[__]"
}
</script>
<style>
  @font-face { font-family: "Poppins"; font-weight: 600; font-display: block; src: url("../../assets/fonts/poppins-600.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 400; font-display: block; src: url("../../assets/fonts/poppins-400.woff2") format("woff2"); }
  @font-face { font-family: "Lora"; font-style: italic; font-weight: 400; font-display: block; src: url("../../assets/fonts/lora-italic.woff2") format("woff2"); }
  :root {
    --ink: #18212F; --text: #1C2430; --muted: #5A6474; --paper: #FFFFFF; --tint: #F1F3F6; --rule: #D9DCE1; --signal: #C8102E;
    --margin: 80px;
    --question-size: 72px;
    --answer-size: 40px;
    --kicker-size: 28px;
    --footer-size: 28px;
    --rule-width: 48px;
  }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: "Poppins", sans-serif; position: relative; }
  .kicker { position: absolute; left: var(--margin); top: var(--margin); font-weight: 600; font-size: var(--kicker-size); color: var(--signal); }
  .kicker::before { content: ""; display: block; width: var(--rule-width); height: 4px; background: var(--signal); margin-bottom: 20px; }
  .block { position: absolute; left: var(--margin); top: 50%; transform: translateY(-50%); width: 80%; }
  .question { margin: 0 0 40px; font-family: "Lora", serif; font-style: italic; font-weight: 400; font-size: var(--question-size); line-height: 1.25; color: var(--ink); }
  .answer { margin: 0; font-weight: 600; font-size: var(--answer-size); line-height: 1.3; color: var(--ink); }
  .footer { position: absolute; left: var(--margin); bottom: var(--margin); font-weight: 400; font-size: var(--footer-size); color: var(--muted); }
</style>
</head>
<body>
  <div class="kicker" data-field="kicker"></div>
  <div class="block">
    <p class="question" data-field="question"></p>
    <p class="answer" data-field="answer"></p>
  </div>
  <div class="footer" data-field="url"></div>
  <script>
    (function () {
      var copy = JSON.parse(document.getElementById("copy").textContent);
      var over = window.__copy || {};
      Object.keys(over).forEach(function (k) { copy[k] = over[k]; });
      var vars = window.__vars || {};
      Object.keys(vars).forEach(function (k) { document.documentElement.style.setProperty(k, vars[k]); });
      document.querySelectorAll("[data-field]").forEach(function (el) {
        var v = copy[el.getAttribute("data-field")];
        if (v == null) return;
        if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
      });
    })();
  </script>
</body>
</html>
