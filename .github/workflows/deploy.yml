name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que no hay PDF en el sitio (A-06)
        run: |
          if find . -path ./node_modules -prune -o -path ./.git -prune -o -iname '*.pdf' -print | grep -v '^./social/out/linkedin-carousel.pdf$' | grep -q .; then
            echo "Hay un PDF fuera de social/out"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
